name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Smoke test REST and auth behavior
        shell: bash
        run: |
          set -euo pipefail

          dotnet run --configuration Release --no-build --urls http://127.0.0.1:5157 > /tmp/gadgetdepo.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:5157/api/products/42 > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/gadgetdepo.log
              exit 1
            fi
            sleep 1
          done

          # Existing REST demo remains valid.
          test "$(curl -sS -o /tmp/product42.json -w '%{http_code}' http://127.0.0.1:5157/api/products/42)" = "200"
          test "$(curl -sS -o /tmp/product999.json -w '%{http_code}' http://127.0.0.1:5157/api/products/999)" = "404"

          # 1) Unauthenticated request to a protected endpoint -> 401.
          test "$(curl -sS -o /tmp/noauth.json -w '%{http_code}' http://127.0.0.1:5157/api/orders)" = "401"
          curl -sS -D /tmp/noauth-headers.txt -o /dev/null http://127.0.0.1:5157/api/orders
          grep -qi '^WWW-Authenticate: Bearer' /tmp/noauth-headers.txt

          # Obtain the customer demo token through the same login call used in Postman.
          CUSTOMER_LOGIN=$(curl -fsS \
            -X POST http://127.0.0.1:5157/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"customer","password":"demo123"}')
          CUSTOMER_TOKEN=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["accessToken"])' <<< "$CUSTOMER_LOGIN")
          test "$CUSTOMER_TOKEN" = "gadget-customer-token"

          # 2) Authenticated request to an endpoint the customer may use -> 200.
          test "$(curl -sS -o /tmp/orders.json -w '%{http_code}' \
            -H "Authorization: Bearer $CUSTOMER_TOKEN" \
            http://127.0.0.1:5157/api/orders)" = "200"

          # 3) Same authenticated customer, but an Admin-only endpoint -> 403.
          test "$(curl -sS -o /tmp/forbidden.json -w '%{http_code}' \
            -H "Authorization: Bearer $CUSTOMER_TOKEN" \
            http://127.0.0.1:5157/api/admin/inventory)" = "403"

          # Invalid bearer credentials also fail authentication -> 401.
          test "$(curl -sS -o /tmp/invalid-token.json -w '%{http_code}' \
            -H 'Authorization: Bearer not-a-valid-token' \
            http://127.0.0.1:5157/api/orders)" = "401"

          # Admin role satisfies the AdminOnly authorization policy -> 200.
          ADMIN_LOGIN=$(curl -fsS \
            -X POST http://127.0.0.1:5157/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin123"}')
          ADMIN_TOKEN=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["accessToken"])' <<< "$ADMIN_LOGIN")
          test "$(curl -sS -o /tmp/admin.json -w '%{http_code}' \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            http://127.0.0.1:5157/api/admin/inventory)" = "200"
